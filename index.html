<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Pokedex</title>

		<link
			rel="icon"
			href="assets/icons/ic-pokedex.svg"
			type="image/svg+xml"
		/>

		<link rel="stylesheet" href="font.css" />
		<link rel="stylesheet" href="style.css" />

		<script defer src="data.js"></script>
		<script defer src="script.js"></script>
	</head>
	<body>
		<header>
			<div class="content-wrapper header-space">
				<div class="logo-content">
					<img
						class="logo-img"
						src="assets/icons/ic-pokedex.svg"
						alt=""
					/>
					<p class="logo-name">Pokedex</p>
				</div>
				<div class="search-content">
					<search>
						<form action="./search/">
							<label for="pokemon-search">Pokémon</label>
							<input
								type="search"
								data-id="search-input"
								name="q"
							/>
							<button data-id="search-button" type="submit">
								Search
							</button>
						</form>
					</search>
				</div>
			</div>
		</header>
		<main data-id="content">
			<div class="content-wrapper main-space">
				<ul id="cardList" class="cards-list">
					<!-- JS rendert hier die einzelnen Karten rein -->
				</ul>
				<div class="load-more-container">
					<button data-id="load-more-button" onclick="loadMore()">
						More Pokémon
					</button>
					<div id="loader" class="d-none"><p>Loading...</p></div>
				</div>
			</div>
			<dialog data-id="dialog">
				<button
					data-id="close-dialog-button"
					onclick="dialogRef.close()"
				>
					X
				</button>
				<button data-id="prev-button" onclick="nextImg('back')">‹</button>
				<div data-id="overlay-pokemon-name">
					<!-- renderDialog füllt: Name, Bild, Stats -->
				</div>
				<button data-id="next-button" onclick="nextImg('forward')">›</button>
			</dialog>
		</main>
		<footer>
			<div class="content-wrapper footer-space">
				<img class="logo-da" src="assets/icons/ic-da-logo.svg" alt="" />
				<p class="copyright">&copy; 2026 Pokedex - Sven Apel</p>
			</div>
		</footer>
	</body>
</html>
