<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Pokédex</title>

		<link
			rel="icon"
			href="assets/icons/ic-pokedex.svg"
			type="image/svg+xml"
		/>

		<link rel="stylesheet" href="font.css" />
		<link rel="stylesheet" href="style.css" />

		<script defer src="data.js"></script>
		<script defer src="templates.js"></script>
		<script defer src="script.js"></script>
	</head>
	<body>
		<header>
			<div class="content-wrapper header-space">
				<button
					class="logo-content"
					onclick="resetToList()"
					aria-label="Back to full list"
				>
					<img
						class="logo-img"
						src="assets/icons/ic-pokedex.svg"
						alt=""
					/>
					<p class="logo-name">Pokédex</p>
				</button>
				<div class="search-content">
					<search>
						<form>
							<input
								type="search"
								data-id="search-input"
								name="q"
								placeholder="Search Pokémon"
								aria-label="Search Pokémon"
							/>
							<button
								data-id="search-button"
								type="button"
								onclick="searchPokemon()"
								aria-label="Search Pokémon"
								disabled
							>
								<img src="assets/icons/ic-search.svg" alt="" />
							</button>
						</form>
						<p id="notFound" data-id="not-found" class="d-none">
							No match found.
						</p>
					</search>
				</div>
			</div>
		</header>
		<main data-id="content">
			<div class="content-wrapper main-space">
				<ul id="cardList" class="cards-list">
					<!-- JS rendert hier die einzelnen Karten rein -->
				</ul>
				<div class="load-more-container">
					<button
						data-id="load-more-button"
						onclick="loadMore()"
						aria-label="More Pokédemon"
					>
						More Pokémon
					</button>
					<div id="loader" class="d-none"><p>Loading...</p></div>
				</div>
			</div>
			<dialog data-id="dialog" aria-label="Pokémon details">
				<button
					data-id="close-dialog-button"
					class="close-btn"
					onclick="closeDialog()"
					aria-label="Close dialog"
				>
					X
				</button>
				<button
					data-id="prev-button"
					class="prev-btn"
					onclick="nextImg('back')"
					aria-label="Previous Pokémon"
				>
					‹
				</button>
				<div data-id="overlay-pokemon-name">
					<!-- renderDialog füllt: Name, Bild, Stats -->
				</div>
				<button
					data-id="next-button"
					class="next-btn"
					onclick="nextImg('forward')"
					aria-label="Next Pokémon"
				>
					›
				</button>
			</dialog>
		</main>
		<footer>
			<div class="content-wrapper footer-space">
				<img class="logo-da" src="assets/icons/ic-da-logo.svg" alt="" />
				<p class="copyright">&copy; 2026 Pokédex - Sven Apel</p>
			</div>
		</footer>
	</body>
</html>
